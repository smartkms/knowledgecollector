[project]
name = "uv-minimal-example"
version = "0.1.0"
description = "Minimal example for a Python project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.11",
    "minio>=7.2.15",
    "pydantic>=2.10.6",
    "requests>=2.32.4",
    "slack-sdk>=3.35.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "ruff>=0.9.9",
]

[tool.uv]
package = false
