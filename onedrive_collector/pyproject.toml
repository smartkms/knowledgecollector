[project]
name = "onedrive_collector"
version = "0.1.0"
description = "OneDrive fetcher for Knowledge Collector"
requires-python = ">=3.13"
dependencies = [
    "shared",
    "redis>=6.2.0",
    "rq>=1.16.2",
    "pymongo>=4.10.1",
    "requests>=2.32.4",
    "azure-identity>=1.18.0",
    "python-dotenv>=1.0.0",   
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"