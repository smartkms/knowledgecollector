[project]
name = "slack_collector"
version = "0.1.0"
description = "Slack fetcher for Knowledge Collector"
requires-python = ">=3.13"
dependencies = [
    "shared",
    "slack-sdk>=3.35.0",
    "requests>=2.32.4",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"