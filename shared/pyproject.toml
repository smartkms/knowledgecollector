[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for Knowledge Collector"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "pymongo>=4.10.1",
    "isodate>=0.7.2",
    "redis>=6.2.0",
    "minio>=7.2.15",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"