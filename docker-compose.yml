version: '3.8'

services:
  redis:
    image: 'redis:7-alpine'
    ports: ["6379:6379"]

  mongo:
    image: 'mongo:latest'
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secret123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data

  api:
    build: .
    container_name: api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/knowledge_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
      - mongo
    ports:
      - "8000:8000"

  scheduler:
    build: .
    container_name: scheduler
    command: ["python", "scheduler.py"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/knowledge_db
    depends_on:
      - redis
      - mongo

  fetch_worker:
    build: .
    container_name: fetch_worker
    command: ["python", "fetch_worker.py"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongo:27017/knowledge_db
    depends_on:
      - redis
      - mongo

volumes:
  mongo-data:
  minio-data:
