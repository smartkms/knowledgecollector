[project]
name = "api"
version = "0.1.0"
description = "FastAPI service for Knowledge Collector"
requires-python = ">=3.13"
dependencies = [
    "shared",
    "slack_collector",
    "discord_collector",
    "onedrive_collector",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.6",
    "pyjwt>=2.10.0"
]

[tool.uv.sources]
shared = { workspace = true }
slack_collector = { workspace = true }
discord_collector = { workspace = true }
onedrive_collector = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"